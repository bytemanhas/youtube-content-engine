services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: youtube-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: youtube_engine
      POSTGRES_USER: youtube_engine
      POSTGRES_PASSWORD: youtube_engine_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U youtube_engine -d youtube_engine"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: youtube-engine-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  